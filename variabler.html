<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cheat sheet variabler

    </title>

</head>
<body>
    <h1>Variabler i JavaScript</h1>
    <P>Hei, <span id="name"></span>(<span id="age">?</span>) </P>
    <script>
     //DEKLARERE VARIABLER
     /*
     *Const: deklarere en konstant verdi som ikke skal endres
     *Let: deklarere en verdi som kan endres
     */
    const firstname="Tore Marius"
    console.log(firstname)
    const lastname = "Akerbæk"
    //Skeiv ut firstname-verdi til HTML-element med id name:
    //vi bruker konkatinerring, altså slår sammen variabler og tekst, for å skrive ut fornavn + etternavn
    document.getElementById("name").innerHTML = firstname + "" + lastname 
    //DEKLARERE EN VARIABEL FOR ALDER
    const birthYear = 1983
    let age = 2026 - birthYear
    document.getElementById("age").innerHTML = age
     </script>
</body>
</html>
